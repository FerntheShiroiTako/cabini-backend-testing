<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Fanart — The Cabini Shrine</title>
    <link rel="icon" type="image/png" href="favicon.ico">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#151D2B">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
    <h1>SUBMIT ART</h1>
    <p>Everything goes to a moderator first</p>
</header>

<nav>
    <a href="/">Shrine</a>
    <a href="/gallery">Gallery</a>
    <a href="/upload">Submit art</a>
    <a href="/panel" id="panelLink" class="hidden">My panel</a>
    <a href="/admin" id="modLink" class="hidden">Admin</a>
    <a href="/owner" id="ownerLink" class="hidden">Staff</a>
    <a href="#" id="authLink">Sign in</a>
</nav>

<section>
    <div class="card" id="gate">
        <h2>Sign in first</h2>
        <p>You need a Discord account to submit art.</p>
        <br>
        <a href="/auth/discord"><button type="button">Sign in with Discord</button></a>
    </div>

    <div class="card hidden" id="formCard">
        <h2>Your submission</h2>
        <form id="uploadForm">
            <p><label for="title">Title</label></p>
            <input id="title" name="title" maxlength="120" required>
            <p><label for="description">Description</label></p>
            <textarea id="description" name="description" rows="4" maxlength="1000"></textarea>
            <p><label for="image">Image — png, jpeg, gif or webp, 5MB max</label></p>
            <input id="image" name="image" type="file" accept="image/png,image/jpeg,image/gif,image/webp" required>
            <br><br>
            <div class="cf-turnstile" id="ts-widget"></div>
            <br>
            <button type="submit" id="submitBtn">Submit for review</button>
        </form>
        <p id="status"></p>
    </div>
</section>

<footer>
    <p class="footer-nav"><a href="/">Shrine</a><a href="/gallery">Gallery</a><a href="/upload">Submit art</a><a href="/panel">My panel</a></p>
    <p>Created in honor of Cabini.</p>
</footer>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="/js/nav-auth.js"></script>
<script src="/js/upload.js"></script>
</body>
</html>
